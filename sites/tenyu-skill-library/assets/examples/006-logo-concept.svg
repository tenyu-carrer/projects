<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ロゴ制作レッスンの架空コンセプト見本</title>
  <desc id="desc">植物の芽と開いた本を組み合わせた抽象的な図形。商標確認やCanvaでの制作を済ませた完成ロゴではない。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f1"/>
      <stop offset="1" stop-color="#eee9dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#182720" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#e5e0d5"/>
  <rect x="54" y="48" width="1092" height="804" rx="28" fill="url(#paper)" filter="url(#shadow)"/>
  <path d="M104 126h992" stroke="#c6b993" stroke-width="2"/>
  <text x="104" y="102" fill="#617264" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="19" letter-spacing="5">BRAND MARK EXPLORATION / 006</text>
  <g transform="translate(600 390)">
    <circle r="195" fill="#f6f4ec" stroke="#d8d1bd" stroke-width="2"/>
    <path d="M-130 78c44-18 88-14 130 12 42-26 86-30 130-12v72c-43-16-86-11-130 15-44-26-87-31-130-15z" fill="#183c2d"/>
    <path d="M0 92V-34" fill="none" stroke="#183c2d" stroke-width="15" stroke-linecap="round"/>
    <path d="M-4 8c-61 4-90-24-82-75 48-3 77 20 82 75z" fill="#6d9473"/>
    <path d="M4-28c8-54 43-77 92-66-3 48-34 70-92 66z" fill="#9caf82"/>
    <path d="M-131 78c45-18 89-14 131 12v75c-44-25-87-30-131-14z" fill="#285942" opacity=".95"/>
    <path d="M131 78C86 60 42 64 0 90v75c44-25 87-30 131-14z" fill="#285942" opacity=".95"/>
    <path d="M0 90v73" stroke="#d5c79f" stroke-width="5"/>
  </g>
  <text x="600" y="665" text-anchor="middle" fill="#20382b" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="35" font-weight="600" letter-spacing="4">CONCEPT ONLY</text>
  <text x="600" y="710" text-anchor="middle" fill="#6a746a" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="21">架空の植物教室を題材にした方向性モックアップ</text>
  <rect x="292" y="755" width="616" height="44" rx="22" fill="#e2dfd2"/>
  <text x="600" y="784" text-anchor="middle" fill="#586859" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="16" letter-spacing="1">NOT A CLEARED MARK · NOT A CANVA FINAL ASSET</text>
</svg>
