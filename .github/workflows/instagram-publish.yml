# Instagram 毎日投稿（全アカウント共通）
# 30分ごとに起動し、各アカウントの投稿時刻（instagram/accounts.json の postTime）を過ぎていて
# まだ投稿していない今日の分があれば投稿する。アカウントを増やしてもこのファイルは変更不要。
# ※ GitHub の定期実行は混雑時に数分〜数十分遅れることがあります
# ※ 2026-09-23 時点、オーナー指示により毎日投稿は停止中（開発中）。
#    再開するときは下の schedule のコメントを外す。
name: instagram 毎日投稿

on:
  # schedule:
  #   - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "アカウント（空欄なら投稿時刻を過ぎた全アカウント）"
        type: string
        default: ""
      dry_run:
        description: "ドライラン（実際には投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-posted-log
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 投稿
        env:
          # --- Instagram アカウントのトークン（new-account.mjs が自動で追記する） ---
          IG_FORTUNE_ACCESS_TOKEN: ${{ secrets.IG_FORTUNE_ACCESS_TOKEN }}
          IG_FORTUNE_USER_ID: ${{ secrets.IG_FORTUNE_USER_ID }}
          IG_POSITIVE_ACCESS_TOKEN: ${{ secrets.IG_POSITIVE_ACCESS_TOKEN }}
          IG_POSITIVE_USER_ID: ${{ secrets.IG_POSITIVE_USER_ID }}
          IG_PSYCHOLOGY_ACCESS_TOKEN: ${{ secrets.IG_PSYCHOLOGY_ACCESS_TOKEN }}
          IG_PSYCHOLOGY_USER_ID: ${{ secrets.IG_PSYCHOLOGY_USER_ID }}
          # --- ここまで ---
          ACCOUNT: ${{ inputs.account }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
        run: |
          if [ -n "$ACCOUNT" ]; then
            node instagram/scripts/publish.mjs "$ACCOUNT"
          else
            node instagram/scripts/publish.mjs --all
          fi

      - name: 投稿履歴を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/content/*/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "instagram: 投稿履歴を更新"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
