# 各アカウントの投稿ワークフローから呼び出される共通処理
name: instagram-publish (共通)

on:
  workflow_call:
    inputs:
      account:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      ACCESS_TOKEN:
        required: false
      USER_ID:
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-posted-log
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 投稿
        env:
          ACCOUNT: ${{ inputs.account }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          PREFIX=$(node -e "console.log(require('./instagram/accounts.json')[process.env.ACCOUNT].envPrefix)")
          export "${PREFIX}_ACCESS_TOKEN=$ACCESS_TOKEN" "${PREFIX}_USER_ID=$USER_ID"
          node instagram/scripts/publish.mjs "$ACCOUNT"

      - name: 投稿履歴を保存
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/content/*/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "instagram: ${{ inputs.account }} の投稿履歴を更新"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
