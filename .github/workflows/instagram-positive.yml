# 前向きな言葉アカウント: 毎朝 7:00 (日本時間) に投稿
# ※ GitHub の定期実行は混雑時に数分〜数十分遅れることがあります
name: instagram 前向きな言葉

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = 日本時間 7:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（実際には投稿しない）"
        type: boolean
        default: true

jobs:
  publish:
    uses: ./.github/workflows/instagram-publish.yml
    with:
      account: positive
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      ACCESS_TOKEN: ${{ secrets.IG_POSITIVE_ACCESS_TOKEN }}
      USER_ID: ${{ secrets.IG_POSITIVE_USER_ID }}
