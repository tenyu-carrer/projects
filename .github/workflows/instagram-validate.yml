# 投稿データを追加・変更したときのチェック
name: instagram 投稿データチェック

on:
  push:
    paths:
      - "instagram/**"
  pull_request:
    paths:
      - "instagram/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node instagram/scripts/validate.mjs
